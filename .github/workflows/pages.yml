name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'README.md'
      - 'docs/CERTIFICATION.md'
      - 'RELEASE_NOTES_v*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build TypeScript site script
        run: npm run build

      - name: Build LaTeX technical paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: yankovinator.tex
          working_directory: docs
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Build LaTeX presentation
        uses: xu-cheng/latex-action@v3
        with:
          root_file: presentation.tex
          working_directory: docs
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Build LaTeX reference manual
        uses: xu-cheng/latex-action@v3
        with:
          root_file: reference.tex
          working_directory: docs
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Stage GitHub Pages site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # Required site assets
          cp docs/index.html docs/styles.css docs/script.js _site/

          # Built documentation PDFs
          for pdf in yankovinator.pdf presentation.pdf reference.pdf; do
            if [ ! -f "docs/$pdf" ]; then
              echo "Missing docs/$pdf"
              exit 1
            fi
            cp "docs/$pdf" _site/
          done

          # Supporting markdown pages linked from the site/repo docs
          for md in README.md RELEASES.md DEPLOYMENT.md CERTIFICATION.md certification-latest.txt; do
            if [ -f "docs/$md" ]; then
              cp "docs/$md" _site/
            fi
          done

          for note in RELEASE_NOTES_v1.06.9.md RELEASE_NOTES_v1.06.8.md RELEASE_NOTES_v1.06.7.md RELEASE_NOTES_v1.06.6.md; do
            if [ -f "$note" ]; then
              cp "$note" _site/
            fi
          done

          # Optional root README snapshot for convenience
          cp README.md _site/PROJECT_README.md

          echo "Staged site contents:"
          find _site -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
