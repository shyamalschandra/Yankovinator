name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Universal Binary
    runs-on: macos-15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Show Swift toolchain
        run: |
          swift --version
          xcodebuild -version
          uname -m
          rustc --version || (curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && source "$HOME/.cargo/env" && rustc --version)
      
      - name: Build Rust batch TUI (arm64)
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env" 2>/dev/null || true
          cd tui
          cargo build --release
          cd ..
          mkdir -p dist/arm64
          cp tui/target/release/yankovinator-tui dist/arm64/yankovinator-tui
          chmod +x dist/arm64/yankovinator-tui
      
      - name: Build for arm64 (native)
        run: |
          set -euo pipefail
          swift build -c release
          mkdir -p dist/arm64
          # Prefer release products path; fall back to find
          YANKO_BIN=$(ls .build/release/yankovinator 2>/dev/null || find .build -path '*release*/yankovinator' -type f | head -1)
          KEYWORD_BIN=$(ls .build/release/keyword-generator 2>/dev/null || find .build -path '*release*/keyword-generator' -type f | head -1)
          BENCHMARK_BIN=$(ls .build/release/benchmark 2>/dev/null || find .build -path '*release*/benchmark' -type f | head -1)
          if [ -z "$YANKO_BIN" ] || [ -z "$KEYWORD_BIN" ]; then
            echo "Error: Could not find built binaries"
            find .build -type f \( -name "yankovinator" -o -name "keyword-generator" -o -name "benchmark" \) | head -20
            exit 1
          fi
          cp "$YANKO_BIN" dist/arm64/yankovinator
          cp "$KEYWORD_BIN" dist/arm64/keyword-generator
          if [ -f dist/arm64/yankovinator-tui ]; then
            echo "Bundled yankovinator-tui (Rust/ratatui)"
          fi
          if [ -n "${BENCHMARK_BIN:-}" ]; then
            cp "$BENCHMARK_BIN" dist/arm64/benchmark
            chmod +x dist/arm64/benchmark
          fi
          chmod +x dist/arm64/yankovinator dist/arm64/keyword-generator
          file dist/arm64/yankovinator
      
      - name: Build Rust batch TUI (x86_64)
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env" 2>/dev/null || true
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            cd tui
            rm -rf target
            arch -x86_64 cargo build --release
            cd ..
            mkdir -p dist/x86_64
            cp tui/target/release/yankovinator-tui dist/x86_64/yankovinator-tui
            chmod +x dist/x86_64/yankovinator-tui
          fi
      
      - name: Build for x86_64 (via Rosetta)
        run: |
          set -euo pipefail
          # Clean build directory for x86_64 build
          rm -rf .build
          # Build using Rosetta when available
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 swift build -c release
          else
            echo "Rosetta/x86_64 arch unavailable; skipping dedicated x86_64 build"
            mkdir -p dist/x86_64
            exit 0
          fi
          mkdir -p dist/x86_64
          YANKO_BIN=$(ls .build/release/yankovinator 2>/dev/null || find .build -path '*release*/yankovinator' -type f | head -1)
          KEYWORD_BIN=$(ls .build/release/keyword-generator 2>/dev/null || find .build -path '*release*/keyword-generator' -type f | head -1)
          BENCHMARK_BIN=$(ls .build/release/benchmark 2>/dev/null || find .build -path '*release*/benchmark' -type f | head -1)
          if [ -n "${YANKO_BIN:-}" ] && [ -n "${KEYWORD_BIN:-}" ]; then
            cp "$YANKO_BIN" dist/x86_64/yankovinator
            cp "$KEYWORD_BIN" dist/x86_64/keyword-generator
            if [ -n "${BENCHMARK_BIN:-}" ]; then
              cp "$BENCHMARK_BIN" dist/x86_64/benchmark
              chmod +x dist/x86_64/benchmark
            fi
            chmod +x dist/x86_64/yankovinator dist/x86_64/keyword-generator
            file dist/x86_64/yankovinator
          else
            echo "Warning: x86_64 build not found. Will use arm64 binary (works via Rosetta on Intel)"
            find .build -type f | head -20
          fi
      
      - name: Verify binaries
        run: |
          file dist/arm64/yankovinator
          file dist/arm64/keyword-generator
          file dist/x86_64/yankovinator || echo "x86_64 build may need adjustment"
          file dist/x86_64/keyword-generator || echo "x86_64 build may need adjustment"
      
      - name: Create binary archives
        run: |
          cd dist/arm64
          extras=""
          [ -f yankovinator-tui ] && extras="$extras yankovinator-tui"
          [ -f benchmark ] && extras="$extras benchmark"
          tar -czf ../yankovinator-arm64.tar.gz yankovinator keyword-generator $extras
          cd ../x86_64
          if [ -f yankovinator ] && [ -f keyword-generator ]; then
            extras=""
            [ -f yankovinator-tui ] && extras="$extras yankovinator-tui"
            [ -f benchmark ] && extras="$extras benchmark"
            tar -czf ../yankovinator-x86_64.tar.gz yankovinator keyword-generator $extras
          else
            echo "x86_64 archive creation skipped"
          fi
          cd ../..
      
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: platform-binaries
          path: |
            dist/arm64
            dist/x86_64
            dist/*.tar.gz
          retention-days: 30

  create-universal:
    name: Create Universal Binary
    runs-on: macos-15
    needs: build
    
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: platform-binaries
          path: dist
      
      - name: Create universal binaries
        run: |
          mkdir -p dist/universal
          
          # Check if x86_64 binaries exist
          if [ -f dist/x86_64/yankovinator ] && [ -f dist/x86_64/keyword-generator ]; then
            # Create universal binaries using lipo
            lipo -create \
              dist/x86_64/yankovinator \
              dist/arm64/yankovinator \
              -output dist/universal/yankovinator
            lipo -create \
              dist/x86_64/keyword-generator \
              dist/arm64/keyword-generator \
              -output dist/universal/keyword-generator
            # Create universal benchmark if available
            if [ -f dist/x86_64/benchmark ] && [ -f dist/arm64/benchmark ]; then
              lipo -create \
                dist/x86_64/benchmark \
                dist/arm64/benchmark \
                -output dist/universal/benchmark
              chmod +x dist/universal/benchmark
            elif [ -f dist/arm64/benchmark ]; then
              cp dist/arm64/benchmark dist/universal/benchmark
              chmod +x dist/universal/benchmark
            fi
          else
            # If x86_64 build failed, use arm64 as universal (works via Rosetta)
            echo "x86_64 build not available, using arm64 binary (works on Intel via Rosetta)"
            cp dist/arm64/yankovinator dist/universal/yankovinator
            cp dist/arm64/keyword-generator dist/universal/keyword-generator
            if [ -f dist/arm64/benchmark ]; then
              cp dist/arm64/benchmark dist/universal/benchmark
              chmod +x dist/universal/benchmark
            fi
          fi
          
          chmod +x dist/universal/yankovinator dist/universal/keyword-generator
      
      - name: Verify universal binaries
        run: |
          file dist/universal/yankovinator
          file dist/universal/keyword-generator
          if command -v lipo &> /dev/null; then
            lipo -info dist/universal/yankovinator || echo "Binary info check skipped"
          fi
      
      - name: Create archives
        run: |
          cd dist/universal
          if [ -f benchmark ]; then
            tar -czf ../yankovinator-universal.tar.gz yankovinator keyword-generator benchmark
          else
            tar -czf ../yankovinator-universal.tar.gz yankovinator keyword-generator
          fi
          cd ../arm64
          if [ -f benchmark ]; then
            tar -czf ../yankovinator-arm64.tar.gz yankovinator keyword-generator benchmark
          else
            tar -czf ../yankovinator-arm64.tar.gz yankovinator keyword-generator
          fi
          if [ -f ../x86_64/yankovinator ]; then
            cd ../x86_64
            if [ -f benchmark ]; then
              tar -czf ../yankovinator-x86_64.tar.gz yankovinator keyword-generator benchmark
            else
              tar -czf ../yankovinator-x86_64.tar.gz yankovinator keyword-generator
            fi
          fi
          cd ../..
      
      - name: Upload universal binary
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            dist/yankovinator-universal.tar.gz
            dist/yankovinator-arm64.tar.gz
            dist/yankovinator-x86_64.tar.gz
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: create-universal
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist
      
      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Create checksums
        run: |
          cd dist
          for file in *.tar.gz; do
            if [ -f "$file" ]; then
              sha256sum "$file" > "${file}.sha256"
            fi
          done
          echo "Checksums:"
          cat *.sha256 || true
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          body: |
            ## Yankovinator ${{ steps.get_version.outputs.version }}

            Local AI parody generator using NaturalLanguage + Ollama (`llama3.2:3b`).

            ### What's new
            - **v1.06.4:** Batch resume checkpoint (`.yankovinator/`, `--fresh-batch`); Rust `yankovinator-tui` (ratatui) for UTF-8 worker dashboard
            - **v1.06.3:** ANSI alternate-screen TUI (restore color/emoji/Unicode; fix ncurses garble + segfault)
            - **v1.06.2:** ncurses alternate-screen batch TUI (no scrolling dashboard on macOS)
            - **v1.06.1:** Fix parallel batch trace trap — NL lock coverage, main-thread MIDI progress, TUI coalescing
            - **v1.06.0:** Batch-only CLI — require `--input-dir`, `--themes-dir`, `--output-dir`; removed lyrics positional, `--keywords` / `-k`, and single-file `--output`
            - **v1.05.0:** Up to 128 workers/consumers; `--consumers`; 64 cloud cap; 64 candidates
            - **v1.04:** `--candidates 10` ranks variants per song×theme; explosion is songs×themes×candidates; `--keep-candidates`
            - **v1.03.1:** combinatorial batch — `--themes-dir` × `--input-dir` (every song × every theme); `--force` above 100 jobs
            - **v1.03:** parallel workers for cloud Ollama (`--workers 10` / `--jobs`); batch mode via `--input-dir` + `--output-dir`
            - **v1.02.1:** crash fix for OED dictionary data race during generation; safer embeddings/CLI validation
            - Unsupervised NLP: embedding lexical substitution, rhyme clustering, coherence critic
            - OED/Webster dictionary word suggestions
            - CLI tools: `yankovinator`, `keyword-generator`, `benchmark`

            ### Downloads
            - **Universal** (recommended): `yankovinator-universal.tar.gz`
            - **Apple Silicon**: `yankovinator-arm64.tar.gz`
            - **Intel**: `yankovinator-x86_64.tar.gz`

            ### Homebrew
            ```bash
            brew tap shyamalschandra/yankovinator
            brew install yankovinator
            ```

            ### Manual install
            ```bash
            tar -xzf yankovinator-universal.tar.gz
            sudo mv yankovinator keyword-generator /usr/local/bin/
            [ -f benchmark ] && sudo mv benchmark /usr/local/bin/
            yankovinator --help
            keyword-generator --help
            ```

            ### Runtime requirement
            Ollama must be running with `llama3.2:3b` (`ollama pull llama3.2:3b`).

            ### Checksums
            See the accompanying `.sha256` files.
          files: |
            dist/yankovinator-universal.tar.gz
            dist/yankovinator-universal.tar.gz.sha256
            dist/yankovinator-x86_64.tar.gz
            dist/yankovinator-x86_64.tar.gz.sha256
            dist/yankovinator-arm64.tar.gz
            dist/yankovinator-arm64.tar.gz.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
